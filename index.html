<html lang="ja">
<head>
<meta charset="utf-8">

<title>SNOWSCAPE v0.3.3</title>
<style>
:root{--bg:#F3F7FA;--card:#FFFFFF;--main:#287CA8;--acc:#79C8E8;--tx:#183247;--sub:#718494;--bd:#DCE6ED;--on:#FFFFFF;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101C29;--card:#1B2B3B;--main:#56B8E5;--acc:#8DD8F5;--tx:#F1F6FA;--sub:#A0B2C1;--bd:#34485A;--on:#0B1A26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101C29;--card:#1B2B3B;--main:#56B8E5;--acc:#8DD8F5;--tx:#F1F6FA;--sub:#A0B2C1;--bd:#34485A;--on:#0B1A26;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
.scr{display:none}.scr.on{display:block}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 18px;font-weight:600;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--main);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.p{background:var(--main);color:var(--on);border-color:var(--main)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.ni:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
/* title */
#title{min-height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#0f2740,#2a6a94 55%,#a9d9ee);color:#fff;text-align:center}
#title svg.mt{position:absolute;left:0;bottom:0;width:100%;height:55%}
.fl{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){.fl{animation:none;top:30%}}
.tc{position:relative;z-index:2;padding:12dvh 20px 40px}
.tc h1{font-size:clamp(38px,9vw,76px);letter-spacing:.14em;margin:0;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.tc p{margin:6px 0 34px;letter-spacing:.3em;font-size:13px;opacity:.9}
.tm{display:flex;flex-direction:column;gap:12px;max-width:300px;margin:0 auto}
.tm .btn{background:rgba(255,255,255,.14);color:#183247;border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px);letter-spacing:.12em;padding:13px}
.tm .btn:hover:not(:disabled){background:rgba(255,255,255,.28)}
.tm .btn.p{background:#fff;color:#183247}
.tn{margin-top:14px;font-size:13px;min-height:20px;background:rgba(0,0,0,.25);display:inline-block;padding:2px 12px;border-radius:99px}
.tn:empty{display:none}
/* new */
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 110px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 4px;font-size:13px;letter-spacing:.12em;color:var(--main)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.opt{background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:left}
.opt small{display:block;color:var(--sub);font-size:12px}
.opt:hover{border-color:var(--acc)}
.grid.m{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grid.m .opt small{white-space:pre-line;line-height:1.5;margin-top:4px}
.map.m3{display:block;position:relative;padding:0;overflow:hidden;border:1px solid var(--bd);height:clamp(380px,62vh,720px);touch-action:none;background:var(--card);color:var(--tx)}
.map.m3.big{height:clamp(480px,calc(100vh - 150px),1200px);height:clamp(480px,calc(100dvh - 150px),1200px)}
main.wide{padding:0}
main.wide .map.m3.big{height:max(360px,calc(100vh - var(--hh,64px) - var(--nh,0px)));height:max(360px,calc(100dvh - var(--hh,64px) - var(--nh,0px)));border:0;border-radius:0}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.dg .card{margin:0}.dg ul{margin:6px 0 0;padding-left:18px}.dg li{margin:4px 0}
@media (max-width:800px){.map.m3.big{height:clamp(420px,calc(100vh - 250px),900px);height:clamp(420px,calc(100dvh - 250px),900px)}}
.m3 canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mh{position:absolute;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;pointer-events:none}
.mh.top{top:10px}.mh.bot{bottom:10px}.mh>*{pointer-events:auto}
.mchip{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--card) 86%,transparent);border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:11px;color:var(--tx);margin:2px 3px 2px 0}
.mchip i{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid var(--bd)}
.mbtn{display:flex;gap:6px}.mbtn .btn{padding:6px 12px;font-size:13px}
.mbtn{flex-wrap:wrap;justify-content:flex-end}
.empanel{position:absolute;top:44px;right:10px;width:280px;max-height:calc(100% - 110px);overflow:auto;background:color-mix(in srgb,var(--card) 90%,transparent);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;color:var(--tx);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:8px}
.emh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.emseg,.emseg2{flex-wrap:wrap}.emseg .btn,.emseg2 .btn{flex:1 1 30%;padding:8px 4px;font-size:13px}.emmode .btn{flex:1;padding:8px 4px;font-size:13px}
.map.m3{touch-action:auto}.empanel{touch-action:pan-y}
.emr{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--sub)}.emr b{color:var(--tx)}.emr input{width:100%;accent-color:var(--main)}
.emb{display:grid;grid-template-columns:1fr 1fr;gap:6px}.emb .btn{padding:8px 6px;font-size:13px}
.emn{margin:0;font-size:11px;color:var(--sub)}
@media (max-width:600px){.empanel{top:auto;bottom:60px;left:8px;right:8px;width:auto;max-height:46%}}
.mfb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;color:var(--sub)}
.opt.sel{border-color:var(--main);background:color-mix(in srgb,var(--main) 14%,var(--card));font-weight:700}
.opt.sel::after{content:" ✓";color:var(--main)}
input[type=text]{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:8px}
input[type=text]:focus{outline:none;border-color:var(--main)}
.hint{font-size:13px;color:var(--sub);margin-top:6px}.hint.err{color:#d2503c}
.note{font-size:12px;color:var(--sub)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:5}
/* game */
#game.on{display:block}
.hd{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
.logo{font-weight:800;letter-spacing:.14em;color:var(--main)}
.rn{font-weight:700;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs{display:flex;gap:16px;font-variant-numeric:tabular-nums;font-weight:600;flex-wrap:wrap}
.hs span small{display:block;font-size:10px;color:var(--sub);letter-spacing:.1em;line-height:1.2}
.body{display:grid;grid-template-columns:210px 1fr;align-items:start}
nav{position:sticky;top:64px;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.ni{display:flex;gap:10px;align-items:center;background:none;border:0;border-left:4px solid transparent;border-radius:10px;padding:10px 12px;text-align:left;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--sub)}
.ni:hover{background:var(--card)}
.ni.on{background:var(--card);border-left-color:var(--main);color:var(--main)}
.ni i{font-style:normal;font-size:18px}
.ns{margin-top:12px;border-top:1px solid var(--bd);padding-top:8px}
main{padding:20px 16px 40px;min-width:0}
main h2{margin:0 0 14px;font-size:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.k small{color:var(--sub);font-size:11px;letter-spacing:.1em}
.k b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.k.f{container-type:inline-size}
.k.f b{font-size:16px;font-size:clamp(12px,11.5cqw,22px);white-space:nowrap}
.tag{font-size:10px;background:var(--bd);color:var(--sub);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.map{min-height:300px;border-radius:var(--r);border:2px dashed var(--bd);background:linear-gradient(var(--card),var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--sub)}
.map svg{width:min(320px,70%);height:auto}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 0 0}dt{color:var(--sub)}dd{margin:0;font-weight:600}
.wip{text-align:center;padding:40px 16px}.wip .ic{font-size:44px}
.bd{display:inline-block;background:var(--acc);color:#0B1A26;border-radius:99px;padding:2px 12px;font-size:12px;font-weight:700}
/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(10,25,40,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.md{background:var(--card);border-radius:18px;padding:22px;max-width:440px;width:100%;max-height:90dvh;overflow:auto;border:1px solid var(--bd)}
.md h2{margin-top:0}
.ov .md{background:var(--card);color:var(--tx)}
.md h2,.md b,.md p,.md dd,.md span{color:var(--tx)}
.md .note,.md dt{color:color-mix(in srgb,var(--tx) 72%,var(--card))}
.md .btn{background:var(--card);color:var(--tx);border-color:var(--bd)}
.md .btn.p,.md .btn.on{background:var(--main);color:var(--on);border-color:var(--main)}
.md .tag{background:var(--bd);color:var(--tx)}
.md input[type=range]{accent-color:var(--main)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.seg{display:flex;gap:6px}.seg .btn{padding:6px 12px}.seg .btn.on{background:var(--main);color:var(--on);border-color:var(--main)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:30;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (max-width:800px){
 .body{display:block}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:7;flex-direction:row;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
 .ni{flex-direction:column;gap:0;border-left:0;border-top:3px solid transparent;font-size:11px;padding:8px 12px;min-width:0;white-space:nowrap;justify-content:center;text-align:center;letter-spacing:0}
 .ni.on{border-top-color:var(--main)}
 .ns{margin:0;border:0;padding:0;display:contents}
 main{padding-bottom:96px}
 .hs{gap:10px;font-size:13px}.logo{font-size:13px}
}
</style>

// 工事費用計算
function emCalcCost(t, bb) {
 let n = 0, mx = 0, digVol = 0, fillVol = 0, area = 0, rockArea = 0;
 if (!bb || !t || (!t.pd && !t.rd)) return {n:0, cost:0, days:0};
 const K = t.k, csArea = (t.cs * 10) * (t.cs * 10);
 for(let j=bb[1]; j<=bb[3]; j++) for(let i=bb[0]; i<=bb[2]; i++){
  const k = j*K+i;
  let chg = false;
  let pdv = t.pd ? t.pd[k] : 0;
  if (Math.abs(pdv) > 0.05) {
   n++; if(Math.abs(pdv) > mx) mx = Math.abs(pdv);
   area += csArea;
   if (pdv < 0) digVol += -pdv * csArea; else fillVol += pdv * csArea;
   chg = true;
  }
  if (t.rd && t.rd[k] && !t.deadRocks[k]) {
   if(!chg) n++; 
   rockArea += csArea;
   chg = true;
  }
 }
 if (n === 0) return {n:0, cost:0, days:0};
 const U_DIG = 150, U_FILL = 200, U_AREA = 100, U_ROCK = 500;
 const cost = Math.floor(digVol * U_DIG + fillVol * U_FILL + area * U_AREA + rockArea * U_ROCK);
 const days = Math.max(1, Math.floor(area / 3000 + (digVol + fillVol) / 4000 + rockArea / 1000));
 return {n, mx, area, digVol, fillVol, rockArea, cost, days};
}

function emCommit(){
 EM.pvOn=false;const t=MV.t;if(!t||!EM.pb)return;
 const stat = emCalcCost(t, EM.pb);
 if(stat.n === 0) { tCancel(t, EM.pb); EM.pb=null; emRefresh(); return; }
 if(G.funds < stat.cost) { toast("資金が不足しています"); return; }
 
 const pt=tCommitPreview(t,EM.pb), bb=EM.pb; EM.pb=null;
 if(!pt){ mvEditRefresh(t,bb,false);emRefresh();return; }
 
 G.funds -= stat.cost;
 G.works = G.works || [];
 G.works.push({
  id: "W_" + Date.now(),
  name: EM.mode === 'region' ? (EM.op==='rock'?"岩場除去(区画)":"造成工事(区画)") : (EM.tool==='rock'?"岩場除去(ブラシ)":"造成工事(ブラシ)"),
  area: stat.area, vol: stat.digVol + stat.fillVol, rockArea: stat.rockArea,
  cost: stat.cost, daysTotal: stat.days, daysLeft: stat.days,
  startDate: G.date, state: "施工中", patch: pt
 });
 
 if(pt.idx) for(let i=0; i<pt.idx.length; i++) t.locks[pt.idx[i]] = 1;
 if(pt.ridx) for(let i=0; i<pt.ridx.length; i++) t.locks[pt.ridx[i]] = 1;
 emSave(t); saveGame(true);
 mvEditRefresh(t, bb, false); emRefresh(); upd();
 toast("地形造成工事を開始しました");
}

function tRegionPreview(t,sel,op,v,F){const K=t.k,cs=t.cs;if(!t.pd)t.pd=new Float32Array(K*K);
 if(op==='rock'&&!t.rd)t.rd=new Uint8Array(K*K);
 let i0=K,j0=K,i1=-1,j1=-1,n=0;
 for(let j=0;j<K;j++)for(let i=0;i<K;i++)if(sel[j*K+i]){n++;if(i<i0)i0=i;if(i>i1)i1=i;if(j<j0)j0=j;if(j>j1)j1=j}
 if(!n)return null;
 const e0=Math.max(0,i0-F-1),e1=Math.min(K-1,i1+F+1),f0=Math.max(0,j0-F-1),f1=Math.min(K-1,j1+F+1),W=e1-e0+1,H=f1-f0+1,D=new Float32Array(W*H).fill(1e9);
 for(let j=f0;j<=f1;j++)for(let i=e0;i<=e1;i++)if(sel[j*K+i])D[(j-f0)*W+(i-e0)]=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const q=y*W+x;let d=D[q];if(!d)continue;if(x>0)d=Math.min(d,D[q-1]+3);if(y>0){d=Math.min(d,D[q-W]+3);if(x>0)d=Math.min(d,D[q-W-1]+4);if(x<W-1)d=Math.min(d,D[q-W+1]+4)}D[q]=d}
 for(let y=H-1;y>=0;y--)for(let x=W-1;x>=0;x--){const q=y*W+x;let d=D[q];if(!d)continue;if(x<W-1)d=Math.min(d,D[q+1]+3);if(y<H-1){d=Math.min(d,D[q+W]+3);if(x<W-1)d=Math.min(d,D[q+W+1]+4);if(x>0)d=Math.min(d,D[q+W-1]+4)}D[q]=d}
 let gx=0,gz=0,mh=0,mx=0,mz=0;
 if(op==='slope'){let sh=0,sx=0,sz=0;for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const k=j*K+i;if(!sel[k]||t.locks[k])continue;sh+=t.h0[k]+t.dl[k];sx+=i;sz+=j}mh=sh/n;mx=sx/n;mz=sz/n;
  let cxx=0,cxz=0,czz=0,cxh=0,czh=0;for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const k=j*K+i;if(!sel[k]||t.locks[k])continue;const dx=(i-mx)*cs*10,dz=(j-mz)*cs*10,dh=t.h0[k]+t.dl[k]-mh;cxx+=dx*dx;cxz+=dx*dz;czz+=dz*dz;cxh+=dx*dh;czh+=dz*dh}
  const det=cxx*czz-cxz*cxz;if(det>1e-6){gx=(cxh*czz-czh*cxz)/det;gz=(czh*cxx-cxh*cxz)/det}const tg=Math.tan(v*Math.PI/180),gm=Math.hypot(gx,gz);if(gm>tg){gx*=tg/gm;gz*=tg/gm}}
 for(let j=f0;j<=f1;j++)for(let i=e0;i<=e1;i++){const dist=D[(j-f0)*W+(i-e0)]/3,w=dist<=0?1:dist>=F?0:.5*(1+Math.cos(Math.PI*dist/F));if(!w)continue;
  const k=j*K+i;if(t.locks[k])continue;
  if(op==='rock'){if(w>0.1)t.rd[k]=1;continue;}
  const bk=t.h0[k]+t.dl[k];let dh;
  if(op==='dig')dh=-v;else if(op==='fill')dh=v;else if(op==='flat')dh=v-bk;else dh=mh+gx*(i-mx)*cs*10+gz*(j-mz)*cs*10-bk;
  let nv=dh*w;nv=Math.max(-ED_MAX-t.dl[k],Math.min(ED_MAX-t.dl[k],nv));nv=Math.max(ED_MIN_E-bk,Math.min(ED_MAX_E-bk,nv));t.pd[k]=nv;t.h[k]=bk+nv}
 return tRelax(t,e0,f0,e1,f1)}

/* ---- 工事管理画面 ---- */
function buildPage() {
  let html = '<h2>CONSTRUCTION</h2><p>地形の造成工事を管理します。MOUNTAIN MAPの「地形造成工事」から開始してください。</p>';
  html += '<div class="card"><h3>施工中の工事</h3>';
  if(!G.works || G.works.length === 0) html += '<p class="note">現在施工中の工事はありません。</p>';
  else {
    html += '<div class="dg">';
    G.works.forEach(w => {
      const pct = Math.round((1 - w.daysLeft / w.daysTotal) * 100);
      let ds = `<dt>面積</dt><dd>${Math.round(w.area/100)/100} ha</dd>`;
      if(w.rockArea) ds += `<dt>岩場</dt><dd>${Math.round(w.rockArea/100)/100} ha</dd>`;
      html += `<div class="card k"><b>${E(w.name)}</b><dl><dt>費用</dt><dd>${yen(w.cost)}</dd>${ds}<dt>進捗</dt><dd>${pct}% (残り ${w.daysLeft} 日)</dd></dl><button class="btn" style="margin-top:8px" onclick="cancelWork('${w.id}')">工事を取り消す</button></div>`;
    });
    html += '</div>';
  }
  html += '</div><div class="card"><h3>工事履歴</h3>';
  if(!G.history || G.history.length === 0) html += '<p class="note">工事履歴はありません。</p>';
  else {
    html += '<ul style="padding-left:20px; font-size:13px; color:var(--sub)">';
    [...G.history].reverse().slice(0, 20).forEach(w => {
      let ext = `面積: ${Math.round(w.area/100)/100} ha`;
      if (w.rockArea) ext += `, 岩場除去: ${Math.round(w.rockArea/100)/100} ha`;
      html += `<li style="margin-bottom:6px"><b style="color:var(--tx)">${E(w.name)}</b> (${w.state} / ${fmtDate(w.startDate)} ～ ${w.endDate ? fmtDate(w.endDate) : ''})<br>${ext}, 費用: ${yen(w.cost)}</li>`;
    });
    html += '</ul>';
  }
  html += '</div>';
  return html;
}
window.cancelWork = function(id) {
  if(!G.works) return; const idx = G.works.findIndex(w => w.id === id); if(idx < 0) return;
  const w = G.works[idx];
  if(!confirm(`「${w.name}」を中止しますか？\n進捗に応じた返金が行われます。`)) return;
  const refund = Math.floor(w.cost * (w.daysLeft / w.daysTotal) * 0.9); G.funds += refund;
  w.state = "取消"; w.endDate = G.date;
  if(TC && w.patch) { 
    if(w.patch.idx) for(let i=0; i<w.patch.idx.length; i++) TC.locks[w.patch.idx[i]] = 0; 
    if(w.patch.ridx) for(let i=0; i<w.patch.ridx.length; i++) TC.locks[w.patch.ridx[i]] = 0; 
  }
  G.history = G.history || []; G.history.push(w); G.works.splice(idx, 1);
  saveGame(true); upd(); toast(`工事を中止し、${yen(refund)}が返金されました`);
}
DAILY.push(g => {
  if(!g.works) return;
  g.works.forEach(w => {
    if(w.state === "施工中") {
      w.daysLeft--;
      if(w.daysLeft <= 0) {
        w.state = "完了"; w.endDate = g.date;
        g.history = g.history || []; g.history.push(w);
        if(TC && w.patch) {
          tApplyPatch(TC, w.patch, true);
          if(w.patch.idx) for(let i=0; i<w.patch.idx.length; i++) TC.locks[w.patch.idx[i]] = 0;
          if(w.patch.ridx) for(let i=0; i<w.patch.ridx.length; i++) TC.locks[w.patch.ridx[i]] = 0;
          emSave(TC); if(MV.t === TC) mvEditRefresh(TC, w.patch.bb, true);
        }
      }
    }
  });
  g.works = g.works.filter(w => w.state === "施工中");
});

 }catch(e){console.error(e);MV.box=null;box.innerHTML=`<div class="mfb"><b style="color:var(--tx)">3Dマップの描画に失敗しました</b><span>${E(String(e&&e.message||e))}</span></div>`}}
